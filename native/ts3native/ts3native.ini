; ts3native.asi settings. Changes apply at the next game start. See docs/15-native-patches.md.
[GC]
; 0 = apply no GC patches
Enabled=1
; Boehm initial heap (game default 40; 352 measured in Bridgeport 2026-10-12: forced GCs 128 -> 1 in 6 min). Range 40-1024. The env var GC_INITIAL_HEAP_SIZE overrides it.
InitialHeapMB=352
; Max heap growth per expansion (game default 8). Range 8-256.
GrowthStepMB=32
; Per-frame GC budget ceiling (game default 1500, probably microseconds). 0 = unchanged. Range 500-20000.
BudgetCeiling=0

[ThreadStack]
; Smaller stack reservations for threads TS3W.exe starts itself (docs/66 §6, threadstack.cpp): the exe's IAT slots for
; CreateThread and _beginthreadex. Every exe thread reserves the PE default 1 MB today (all 7 call sites pass 0 or a commit
; size). DLL threads (DXVK, driver, S3SS, S3PP, ours) are not touched. Address space only. OFF until the addr-quickwins A/B.
Enabled=0
; Reservation per thread when the caller asks for less (and did not ask for a reservation itself). 0 = observe only: log
; every start with its real reservation, change nothing. Range 128-1024 (1024 = no change with the 1 MB PE default).
ReserveKB=512
; Hex start addresses (or EAThread user functions) that keep the game's stack. Default: SimulatorThread_Proc 0x76B470
; (Mono interpreter, deep native recursion). Up to 8, comma separated.
Skip=0x76B470
; Log lines for the first N thread starts (start, user function, asked size, real reservation read from the TEB).
LogThreads=64

[RouteCache]
; Negative cache for failed route plans at Route_PlanLocked 0x82C6E0 (docs/15 phase 2). Off: tested in game 2026-10-14, 12 hits in 6,681 plans (0.2%), no gain.
Enabled=0
; A no-path failure answers the same request (follower, options, start and goal points in 0.5 m cells) with a plain failure for this long, real time. Range 100-60000.
WindowMs=2000
; Table size (rounded up to a power of two). Range 256-65536.
MaxEntries=4096

[RouteWorker]
; Route search on a worker thread while the calling (sim) thread waits (docs/18 first step, "offload-sync"): same arguments
; and result, only the thread changes. Uses the same Route_PlanLocked 0x82C6E0 detour as the cache and works with it. OFF until verified in game.
; 1 = start the worker thread and install the detour.
Enabled=0
; Start value of the runtime switch (ts3native_counters.workerMode; the probe flips it: /native?routeworker=0|1). 0 = plan on the calling thread, 1 = on the worker.
Mode=0

[RouteAsync]
; Async route plan (docs/18 "Async plan"): a plan from a Sim's own yielding task (asked by the ts3fixes Route.Plan hook) runs
; on the worker thread while the sim thread goes on and the Sim's task sleeps tick by tick until the result is ready.
; Detours IC_Route_Plan 0x765160, Route_GetOption 0x74D040 and Lock_Acquire 0x4E16F0, starts the worker and installs the
; Route_PlanLocked detour (worker Mode stays as set above). Needs ts3fixes with the async hook.
; 0.11.0 (H6 S3b + M1): START is refused unless [RouteGate] Enabled=1, Sites=1 and Enforce=1 are all installed (the
; worker then holds the routing lock world+0x918 for the whole job; docs/60 2.3/2.4). Without them async never starts.
; 0.36.0 (release v0.1.4): ON by default with [RouteGate] Enabled/Sites/Enforce=1 and [Discourage] Enabled=1 (env-on
; runs: sim route time 119 -> 50 ms/s, +10-12% iterations/s, PLAN.md H6 state). Kinds stays 0 (A10 replans not released).
Enabled=1
; Start value of the runtime switch (ts3native_counters.asyncMode; /native?routeasync=0|1). 0 = plans stay synchronous, 1 = async.
Mode=1
; 0.17.0 (counters v35 rfb*, docs/60 §2.3), observe only: in Mode 1, sync route plans on the sim thread are timed; those
; >= 50 ms are counted by reason group, those >= this many ms get a log line with the reason (max 20 lines/min). 0 = off.
LogFallbackMs=200
; 0.22.0 design A10 (docs/87 §5, counters v40 ar*), EXPERIMENTAL, never run in game: the Replan-family route ICs as async
; jobs too, through the same handshake (needs ts3fixes 0.22.0+ hooks on Route.Replan / PlanFromPoint / ReplanFromPoint).
; Bit mask of collect detours: 1 = IC_Route_Replan 0x765490, 2 = IC_Route_PlanFromPoint 0x765240, 4 =
; IC_Route_ReplanFromPosition 0x765550 (7 = all). 0 = nothing hooked, today's behaviour. A route being followed stays sync.
Kinds=0
; Start value of the runtime switch (ts3native_counters.arMode +0x14A8; --ab asyncreplan). 0 = shadow (every START check
; runs and is counted in arShadow, the plan stays synchronous), 1 = async.
KindsMode=1

[RouteBudget]
; Cap on one route search request (docs/15 phase 4): over budget, the world A* 0x676260 sees every further edge as blocked
; and fails through its own exit, i.e. an ordinary FailedBecauseNoPathToDestination. Needs the Route_PlanLocked detour
; (installed by this key too). Lot/portal searches (0x63E340) are not capped. OFF until verified in game.
; 1 = patch the A*'s five cost-function pointers (0x676340-0x676368) and install the detour.
Enabled=0
; Start value of the runtime switch (ts3native_counters.budgetMode; /native?routebudget=0|1). 0 = no cap, 1 = cap.
Mode=1
; Nodes generated per request (all A* runs inside one Route_PlanLocked, incl. its retries). 0 = no node cap. Range 1000-10000000.
; No default yet: set it above the budgetMaxNodesOk counter of an uncapped run.
MaxNodes=0
; Time per request, microseconds (checked every 16 nodes). 0 = no time cap. Range 5000-2000000.
; 100 ms = 4x the Isla Paradiso mean plan (25.4 ms) and 28x Bridgeport's (3.6 ms); BP's longest single search was 188 ms.
MaxUs=100000
; 1 = cap only routes with RouteOption DebugPathPlan (hi word bit 0x1) set, for a C# caller that marks unseen townies.
; Nothing sets that bit yet, so 1 means "cap nothing" today.
OnlyFlagged=0

[SaveWrite]
; Save timing and the old-save backup copy off the sim thread (docs/15 phase 7). Hooks six call sites of the native save
; FUN_00AB1030 and logs one line per save (total, package write, backup, copy, final flush). Verified in game 2026-10-14 (two saves, backup by the worker, save reloads); on in the stable build.
Enabled=1
; Start value of the runtime switch (ts3native_counters.saveMode). 0 = time only, the game backs up the old save itself;
; 1 = a worker copies the old save to <TS3 user folder>\ts3native-backup.tmp while the game writes the package, and the
; backup step renames it to <name>.sims3.backup (the game's own copy runs instead if anything does not match).
Mode=1

[Decompress]
; Faster RefPack decoder (docs/15 phase 6): retargets the one call to the decode core (call at 0x4EC065 -> 0x4EB3B0) to RefpackFast,
; same results and bytes as the game (offline test: 3.7 GB of shipped resources identical; 2.2x a C port of the game decoder, 1.8x S3SS RefPackDecompressor).
; Verified in game 2026-10-14: Verify=1 over a Bridgeport load, 33,121 calls, 0 mismatches; ~144k calls in 4 sessions, 0 fails. On in the stable build.
; Does not touch 0x4EB3B0, so S3SS's patch there stays as the mode-0 path. Logs calls, MB, ms and threads every 60 s.
Enabled=1
; Start value of the runtime switch (ts3native_counters.decompressMode): 0 = the code at 0x4EB3B0 (S3SS or the game), 1 = RefpackFast.
Mode=1
; 1 = mode 1 also decodes with 0x4EB3B0 into a scratch buffer and compares (counts mismatches, keeps that result). Slow: first runs only.
Verify=0

[Alloc]
; Per-thread cache in front of EA's general allocator (docs/15 phase 8): frees of chunks up to 1 KB are kept per thread and per
; heap and handed to the next Malloc of that size without the heap's lock and without 0x4E5E40. Detours Malloc 0x4E69D0,
; Memalign 0x4E6A20 (align <= 16, offset 0 only), Free 0x4E5920 and Shutdown 0x4E5CB0. Cached chunks stay allocated as far as the heap knows; no new memory is reserved.
; OFF until verified in game.
Enabled=0
; Start value of the runtime switch (ts3native_counters.allocMode): 0 = every call goes to the game, 1 = cache.
Mode=1
; Chunk bytes one thread may hold. Range 16-1024.
ThreadKB=64
; Total for all threads: MaxMB / ThreadKB threads get a cache, the rest run uncached. Range 1-32.
MaxMB=4
; Chunks per size (16-byte steps) per heap per thread. Range 4-256.
PerBin=32
; docs/67 crash lead: a second Free of a chunk this thread already caches would hand it to two owners. 1 = drop that Free (the
; first one still owns the chunk) and count it (allocDupFrees, counters v23); 0 = old behaviour, still counted. Runtime switch
; ts3native_counters.allocDedupe (+0xC1C, --ab allocdedupe). Same thread only. OFF until measured; keep Enabled=0 without it.
Dedupe=0

[WaterJps]
; Water-grid jump-point search (docs/15 phase 9): the jump 0x61FE10 of the boats/swimming route search 0x620560 (recursive, one call
; plus about ten helper calls per cell) runs as one inlined loop, WaterJump. Same results: 43.9M jumps on random grids identical to the
; game's own code (out\waterjps-test.exe), 3.9x faster offline. Retargets the call at 0x6207FB only; skips itself when the code there
; differs from Steam 1.67. Verified in game (Isla Paradiso, Verify=1: 5.4M calls, 0 mismatches); on in the stable build.
Enabled=1
; Start value of the runtime switch (ts3native_counters.waterJpsMode): 0 = the game's jump, 1 = WaterJump.
Mode=1
; 1 = mode 1 also runs the game's jump and compares (counts and logs mismatches, uses the game's result). First runs only.
Verify=0

[SaveFlush]
; The new save's flushes off the sim thread (docs/15 phase 10): the FlushFileBuffers passes of save steps 9 and 11 (calls at
; 0xAAFD8A and 0xAAF737 to 0xAAF4B0) are recorded during the save and replayed in the same order by a worker right after it.
; The bytes are written before the game reports success; only an OS crash or power loss in the next ~second could lose them
; (the .backup was flushed before). The next save, travel and the load copy (0xAB16ED) wait for the worker first.
; Needs [SaveWrite] Enabled=1. OFF until verified in game.
Enabled=0
; Start value of the runtime switch (ts3native_counters.flushMode): 0 = the game flushes during the save, 1 = the worker after it.
Mode=1

[SaveCompress]
; Package commit compression on worker threads (docs/15 phase 10): at the commit call 0x4A850F the committing thread copies the
; pending records' bytes ahead of the commit loop and workers run the game's own RefPack compressor 0x4EC0A0 on them (own
; scratch memory, no game allocator, no Mono). The codec slot 0xFB901C answers a call with the same input, length and mode
; from the finished job; anything else runs the game's code. Offline: every record of three Baseline saves byte-identical
; to the serial path, 3.3-3.6x faster commit (out\savecompress-test.exe). Skips itself when the compressor code differs from
; Steam 1.67. OFF: in game 2026-10-14 no batch ran (save records commit one by one on close, docs/15 phase 10);
; with Enabled=1 it still logs per save how many compress calls ran outside a batch and their time.
Enabled=0
; Start value of the runtime switch (ts3native_counters.compressMode): 0 = the game compresses in the commit loop, 1 = workers.
Mode=1
; 1 = every answered call also runs the game's compressor and uses its result (counts mismatches). Slow: first runs only.
Verify=0
; Worker threads. Range 1-8.
Threads=6
; Record copies plus outputs in flight (address space at save time). Range 4-256.
MaxMB=32
; Compressed-bytes cache (docs/26 §8): a save record whose uncompressed bytes equal an earlier one's (same length, mode,
; 64-bit hash) gets the stored compressed bytes instead of a new compression: the game's own output, byte for byte. Hits
; only on the 2nd+ save of a load (about 40% of the bytes after play, ~100% with no play between). MB of compressed bytes
; kept (address space, all the time once filled); 0 = off. Verify=1 above also compresses every hit and compares. Range 0-256.
CacheMB=0

[FootprintIndex]
; Save: the routing footprint writer 0x6663C0 scans the whole world footprint map once per floor level of every lot
; (docs/25, ~1.2 s per Bridgeport save). With this on it walks the map once per lot and hands the writer only that level's
; entries, in the same order, so the save bytes are the same. One log line per save: "footprint: levels N entries M
; matched K calls C ms T verify ...". Skips itself when the code differs from Steam 1.67. OFF until verified in game.
Enabled=0
; Start value of the runtime switch (exported DWORD ts3native_footprintMode): 0 = the game's scan, 1 = the index.
Mode=1
; 1 = also walk the real map for every level and compare; a mismatch uses the real map (counted in the log line). Slow.
Verify=0

[HeightCache]
; Terrain height cache (docs/20 §4b): route search asks 0xC2A570 for the same points again and again; cached per
; (grid, x, z), dropped on every cell rebuild 0xC2A840. Runtime switch ts3native_counters.heightMode (+0x1B4), counters v13
; (docs/registry.md). OFF until verified in game.
Enabled=0
Mode=1
; Verify=1: every hit also runs the raycast and compares the bits (first 10 mismatches logged).
Verify=0
; 2-way sets, 40 B per entry (65536 = 2.5 MB); per-cell invalidation (docs/20 §4b).
Entries=65536

[TerrainGrave]
; H6 S3a (docs/60 §2.2 #2, docs/38 C1, 0.10.11): the terrain cell rebuild 0xC2A840 frees the cell's old collision shape
; while other threads may still ray-cast through it (0xC2A570). With this on, that one release (PhysShape_Release 0x682760
; called from 0xC2A896) is parked in a 64-entry ring and run at the next rebuild once no ray is in flight. Uses the
; [HeightCache] detours (installed without a table when [HeightCache] is off). Counters v25 tg* / vfRtGrave*, and
; vfSwaps / vfSwapsInRay from these stubs. OFF until verified in game.
Enabled=0
; Start value of the runtime switch tgMode (+0xD00; --ab terraingrave): 0 = the game's release, 1 = park.
Mode=1

[GcThreadCheck]
; Measurement only (docs/29 §4.5): logs the first thread that reaches a GC slow path and counts slow-path allocations
; from any other thread (counters v14 gcForeignAllocs; first 8 logged with the caller's return address). > 0 means a
; thread allocates through the unlocked GC_malloc fast path = latent heap race. No behaviour change.
Enabled=0

[IcLockCheck]
; Measurement only (docs/29 §5): replaces mono_loader_lock/unlock 0xE85020/0xE85030 (global loader_mutex 0x11F43A8) with
; counting versions of the same lock: enters, contended enters (TryEnter failed) with QPC wait, owner thread changes,
; unlocks with waiting threads (counters v15). Logs [0x11EE6CC] and the first 32 distinct caller addresses. No behaviour change.
Enabled=0

[RouteGate]
; Measurement only (docs/18 H6 step S2a): tracks which thread owns the routing lock world+0x918 (Lock_Acquire 0x4E16F0 and
; Lock_Release 0x4E17B0, that lock only; learned from Route_PlanLocked) and puts pass-through stubs on the 12 S0 gate sites
; plus gate sites 13-15 (docs/60 §2.2: 0x628A90, 0x835240, 0x835110; 0.10.11).
; Counts per site the outermost entries by a thread that does not hold +0x918 (rgUnlocked) and those made while a
; route-worker or async job runs (rgJob: 0 unless [RouteWorker] Mode=1 or async is on), counters v16 + v25. Also the exact
; G11 window (g11*: sim-thread plan length vs the gap to the next routing touch, docs/18 (3)). Logs the first 48 distinct
; site/caller pairs. No locking, no behaviour change. Installs nothing if one prologue differs.
; 0.36.0: ON by default (Enabled, Sites, Enforce = 1): background routing ([RouteAsync]) needs all three.
Enabled=1
; H6 S2b (docs/60 §2.3, 0.10.11): count-only stubs on the docs/60 §2.2 closure sites (quadtree readers, writers and leaves,
; object destroy, lot index and pending updates, save / BuildRoutingData / lot save, routing debug frame, world init and
; teardown), counters v25 vfRt*. Needs Enabled=1. Each site installs on its own. Run with [RouteWorker] Mode 0 and 1.
Sites=1
; H6 S3b + M1 (docs/60 2.2-2.5, 0.11.0, counters v26): 1 = closures on while an async job runs: gate entries by other
; threads wait for the job (the sim thread runs the job's managed calls meanwhile), the owner borrows the job's lock inside
; a callback, quadtree lock for the worker's readers vs mutators, destroys and saves wait for the job, routing debug frame
; skipped, travel / quit ICs 0xEC1180 / 0xEC11B0 drain and refuse START until the next world init. START only in a quiet
; world (no save, no pending lot updates, clean lot index; asyncRefusedM1). Needs Enabled=1, Sites=1 and [RouteAsync].
Enforce=1
; Design G10-C (docs/87 §5, 0.20.0, counters v38 p10Ready bit 1): 1 = gate site 10 moves from the goal step 0x75C2D0 to its
; only caller Route_PlanCommon 0x7606E0 (prologue checked; differs: logged, site 10 stays). With Enforce=1 a sync plan then
; waits once for a running job and keeps job starts off for the whole plan (goal step, Route_PlanLocked, EditPath tails);
; holds >= 100 ms are logged ("G10-C:", first 20). Gate-10 counters and the wait key (Route_PlanCommon's caller 0x76429D /
; 0x764400 instead of 0x760BFF) then describe the whole plan. Load-time only (no runtime switch). OFF: not run in game.
G10Common=0

[Discourage]
; Design D (docs/84 §2.4, 0.12.0, counters v30): while an async route job runs, RoutingWorld_Add/RemoveDiscourageFootprint
; (0x834370 / 0x834860) are recorded and applied in order later on the sim thread with no job running (script ignores their
; result). Needs [RouteGate] Enforce=1. Runtime switch discMode (+0x1074, --ab discourage). 0.12.2 crashed applying a
; deferred Add (AV under the lot lookup 0xC62D40 called from 0x834519; 2026-10-17); fixed by D-X below (0.16.0).
; 0.36.0: ON by default with [RouteAsync] (every env-on run since 0.12.4 had it on).
Enabled=1
Mode=1
; Fix D-X (docs/84 §7.2, 0.16.0, counters v34), correctness parts of D, on whenever Enabled=1 (set 0 only for an A/B):
; DestroyApply=1: a destroy (ObjectService_DestroyById) first applies its object's queued Remove records and drops its Add
; records (runtime switch discDestroyMode +0x135C, --ab discdestroy). DeadSweep=1: a Remove record whose object is gone at
; apply removes the footprints left under its id (0x635700, all lots; discSweepMode +0x1360, --ab discsweep). Tripwire
; T-D5: discDropRemove = discDeadSweep; discIdMismatch must stay 0.
DestroyApply=1
DeadSweep=1

[LotRemoveGuard]
; 0.31.5 (docs/94 §21.12, counters v57 lrPendFlush / lrPendBusy): before a lot-0 LotRouting_RemoveObjectFootprints 0x635700,
; flush (game's 0x666A40) the quadtrees that still hold a deferred remove of that id; without it the game's walk can run past
; its range and crash at 0x63576A (bp-snap-p4 on 0.31.2). Entry detour on every build; with [RouteSnap] its stub does the same.
; 1 = on (default), 0 = off.
Enabled=1

[SteerRO]
; Design S2 (docs/84 §3.6, 0.13.0, counters v31): while an async route job runs, Locomotion_ObstacleCheck 0x85FD10 answers
; from a read-only clone (no +0x918 wait) under the reader/writer lock QL; the worker holds QL exclusive in the 12 W1-W6
; writer detours and the LotGraph_Build gate stub. Any doubt calls the game's code (today's wait). Needs [RouteGate]
; Enforce=1 and [RouteAsync]. Runtime switches steerMode (+0x10A4, --ab steerro) and steerShadow (+0x10A8, --ab steershadow).
; Shadow=1: with no job running, the game's call then the clone, differences counted (steerShadowMismatch must stay 0).
; 0.15.0 (counters v33) adds tripwires T4 and T-S7 (11 counting stubs, docs/84 §3.6): a tree/entry helper outside QL or an
; fp+0x20 / lock-key / LotGraph_Reset writer on a thread other than the sim while a clone runs drops that clone's answer
; (steerFbTrip, steerTripDiscard); steerT4Bare and steerS7Foreign must stay 0.
; OFF until a shadow run and an enabled run have passed in game.
Enabled=0
Mode=1
Shadow=0

[FpRebuildLock]
; Fix C-A (docs/84 §4.4, 0.13.0, counters v31): Footprint_EnsureLevelPolygons 0x80E5B0 on the sim thread while an async job
; runs, for an invalid level of classes 0xFEB848/0xFEB970/0xFEBD10/0xFEBE38, takes +0x918 before the level is marked valid
; and emptied (today it waits inside the rebuild, leaving the level valid and empty while the job may read it). No gain:
; the same wait, earlier. Never waits while the thread holds QL. Uses the W6a stub (installed alone when [SteerRO] is off).
; Needs [RouteGate] Enforce=1. Mode=0 counts only (T-L5, caSimInJob); Mode=1 takes the lock. Runtime switch caMode (+0x1110,
; --ab fprebuildlock). OFF until the observe run shows caSimInJob > 0.
Enabled=0
Mode=0

[LotFrontDoorRO]
; Design L1 (docs/84 §4.6, 0.14.0, counters v32): while an async route job runs, LotRouting_FrontDoorPortal 0x631800
; (Lot.GetFrontDoor) answers from a read-only clone (no +0x918 wait at LotTable_Contains, no portal AddRef/Release) under QL
; shared, try only; the worker holds QL exclusive in W4 (LotGraph_Build gate stub), W5 0x62E680 and W6g 0x80CB40/0x806770
; (installed here when [SteerRO] is off). Any doubt calls the game's code (today's wait). Needs [RouteGate] Enforce=1 and
; [RouteAsync]. Runtime switches ltMode (+0x1134, --ab lotfdro) and ltShadow (+0x1138, --ab lotfdshadow). Shadow=1: with no
; job running, the game's call then the clone, compared (ltShadowMismatch must stay 0). OFF until a shadow run and an enabled
; run have passed in game.
Enabled=0
Mode=1
Shadow=0

[ObstructedRO]
; Gate-0 fix (docs/86 §10, 0.21.1, counters v41): while an async route job runs, IC_Route_IsPointObstructedBySim 0x751480
; (SimRoutingComponent after a route with CheckForFootprintsNearGoals; 99% of the gate-0 waits in bp-p1b) answers from a
; read-only clone under QL shared, try only: no wait at the lot transform (gate 0) or the obstacle query (+0x918), no
; footprint refcounts. Uses the S2 writer set (W1-W6, W4, tripwires; installed here when [SteerRO] is off). Any doubt calls
; the game's code (today's wait). Needs [RouteGate] Enforce=1 and [RouteAsync]. Runtime switches orMode (+0x1528, --ab
; obstructedro) and orShadow (+0x152C, --ab obstructedshadow). Shadow=1: with no job running, the game's call then the
; clone, compared (orShadowMismatch must stay 0). OFF until a shadow run and an A/B have passed in game.
Enabled=0
Mode=1
Shadow=0
[SlotEnabledRO]
; Design SH (docs/90, 0.22.2, counters v42), gate-12 family F-B: while an async route job runs, the slot position helper
; 0x76F0A0 (IC_Slots_GetPositionOfSlotImpl, IC_RouteManager_IsSlotUnobstructed; the name is the queue's, the IC is not
; IsSlotEnabled) runs the game's own body under QL shared (try only): LotTable_Contains and GetOrInsert hits pass without the
; +0x918 wait; any other gate, a gate-0 miss, an odd portal, a lock, host or managed call drops the hold and waits as today.
; Portal vtable 0xFED048 AddRef/Release become interlocked while it is installed. Needs [RouteGate] Enforce=1 and [RouteAsync].
; Runtime switches slMode (+0x1568, --ab slotenabledro) and slShadow (+0x156C, --ab slotenabledshadow). Shadow=1: with no job
; running, the game's call then the call under a dry hold, compared (slShadowMismatch must stay 0). Experimental, OFF.
Enabled=0
Mode=1
Shadow=0

[ProbeP1b]
; Probe P1b (docs/84 §4.4/§4.6, 0.14.0, counters v32), observe only: gate waits during jobs keyed by the leaf's caller (P1) at
; 0x62F782/0x62FB74/0x631814/0x631F40 (gate 12) and 0x62EF7A (gate 0) are keyed by the caller's caller too (p1bKey/N/Us);
; portal AddRef/Release through vtable 0xFED048 during jobs counted by thread (T-L3, portalRef*). Installs the QL writer stubs
; W4/W5/W6g (uncontended without a reader) to split worker calls. Needs [RouteGate] Enforce=1 and [RouteAsync]. Report:
; node tools/harness/p1b-report.ts <native.json>.
Enabled=0

[LocoWindow]
; Design H2 (docs/86 §5, 0.19.0, counters v37): the Locomotion_Update call 0xD81C5C (sim thread) goes through a thunk; in
; Mode 1 no queued async route job starts while the locomotion pass runs (a job already running may finish). Any sim wait
; for a job that has not started drops the window first (g0wDrop); the worker lets go after 250 ms anyway (g0wWatchdog, must
; stay 0). Mode 0 only counts (g0wJobStartInPass = the starts Mode 1 would hold). Needs [RouteGate] Enforce=1 and
; [RouteAsync]. Runtime switch g0wMode (+0x13E8, --ab locowin). OFF until a shadow run and an A/B have passed in game.
Enabled=0
Mode=1

[ProbeP10]
; Probe P10 (docs/87 §6, 0.20.0, counters v38), observe only: pass-through stubs on IC_Route_Replan 0x765490,
; IC_Route_PlanFromPoint 0x765240 and IC_Route_ReplanFromPosition 0x765550 (IC_Route_Plan through the async IcPlanHook) tag
; sim-thread code by route IC: entries (p10Entries), Route_PlanLocked time (p10PlanUs), entries that reached gate site 10
; but planned nothing (p10EarlyRet), CanYield() at entry (p10CanYield, not for Plan); gate-10 waits by IC in the P1b table
; (row 6, key 0x760BFF, second frame = the IC address). Needs [RouteGate] Enforce=1 and [RouteAsync]. Report:
; node tools/harness/p10-report.ts <native.json>.
Enabled=0

[MonoThread]
; Second managed thread, docs/30 (P1 + P2 here; P3, P4 and the worker below, M5 build). Replaces the GC root hook [0x11949CC] (after checking
; it still leads to 0xD71820) with one that, while the world is stopped, also pushes every other suspended registered
; thread's registers and stack; at the first Simulate tick the sim thread logs Boehm's thread table and registers itself
; if missing. With only the collecting thread registered the scan is the game's. Counters v18. OFF until verified in game.
Enabled=0
; 0 = patches only, no worker. 1 = one registered worker thread (idle until a job is handed to it; the managed MtProbe
; job is a later step); needs GcLock=1 and FrameTls=1, else runs as 0. 2 (GC stress) is not built yet and runs as 1.
; Runtime switch mtMode: the worker starts / stops at the next Simulate tick.
Mode=0
