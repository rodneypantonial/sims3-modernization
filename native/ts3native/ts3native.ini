; JobManager fixes (docs/36 §8 C2/C3, docs/46 §7, PLAN #13/#14; counters v23 jq*). Enabled=1 installs the ExecuteJob counters
; (shared and frame jobs per thread; [Verify] execJob is then skipped) and whatever the keys below ask for. OFF until measured.
Enabled=0
; #13: the sim pump stops taking shared-queue jobs (bit 31 of the sim job record cleared before each pump pass; vtable slot
; 0xFD97C8, not the S3SS window at 0xD81FC3). 0 = not installed, 1 = installed and on, 2 = installed but starts off (for --ab:
; runtime switch ts3native_counters.jqSimMode, +0xBF4).
SimSkipShared=0
; #14: generic JobManager workers (JobThread0..n, game default 1, range 1-4; JobManager_Init argument at 0x5992DE). Start-up
; only, not switchable at run time. Pairs with SimSkipShared: the shared jobs the sim no longer takes go to these workers.
Workers=1

[D3DMultithreaded]
; PLAN #4 (docs/37 C5, docs/43 §1): create the D3D9 device with D3DCREATE_MULTITHREADED (flags 0x40/0x20 -> 0x44/0x24 at
; 0x6112A4/0x6112B9), so thumbnail textures created and filled on the sim thread (0xD5D910) no longer race the main
; thread's rendering. Every device call then takes a lock (DXVK honours the flag [inferred]). Start-up only. OFF until measured.
Enabled=0

[LotSinCos]
; Lot world-to-local sin/cos cache (PLAN #11, docs/38 C2): 0xAB8540 runs fsin + fcos of the lot angle on every call (0.60%
; sim self); the replacement takes them from a 256-entry cache keyed on the angle bits and repeats the rest with the same
; SSE instructions, so the output is bit-identical. Runtime switch ts3native_counters.lscMode (+0xC28, --ab lotsincos),
; counters v24 lsc*. OFF until measured.
Enabled=0
Mode=1
; Verify=1: every hit also runs the game's function and compares the output bits (lscMismatches, first 10 logged).
Verify=0

[IdCache]
; Object id cache (PLAN #22, docs/45 O2): ObjectId_Lookup 0x939100 walks chains of 8-15 objects per id (1,033 fixed buckets).
; Sim-thread lookups are answered from a 4096-entry id -> object cache; EraseNode 0x938D00 (the only unlink) drops the
; entry first. Runtime switch ts3native_counters.idcMode (+0xC3C, --ab idcache), counters v24 idc* (chain length =
; idcStepsK / (idcFillsK + idcNotFoundK)). OFF until measured.
Enabled=0
Mode=1
; Verify=1: every hit also walks the chain and compares (idcMismatches, first 10 logged; the walk's answer is returned).
Verify=0

[ProbeSnap]
; Snapshot study (docs/94 §7, 0.23.0, counters v43 vc*), observe only: runtime targets of the indirect call/jmp sites of
; the routing closure (Route_PlanLocked, Route_PlanCommon, route ICs, writer leaves, portal and lock-key ICs; site list
; from tools/snap-vcall-sites.py in vcallsites.h), on every thread. int3 on each site; a vectored handler records (site,
; target) and runs the instruction itself. Each site disarms after PerWindow hits, all are re-armed every WindowSec, the
; first time DelaySec after start-up. Log lines "vcall SITE -> TARGET n=N [out=module]"; tools/harness/snap-report.ts lists
; the targets the symbol table does not know. OFF unless a probe job turns it on.
; Threads=1 (docs/109 §8.8): each pair also counts hits by thread class (" thr=job:N,worker:N,sim:N,other:N"; job = route
; worker inside a plan); only job hits spend PerWindow, other hits disarm a site after 16 x PerWindow.
; CallSites=1 (docs/133 §7, 0.36.64, counters v130 cp*): passive call-site coverage on the docs/133 §6 table (vcallsites5.h:
; Mono glue + routing sites), used when Enabled=0. Armed once DelaySec after start-up; a site restores its own byte after
; CallSitesMinHits hits with fewer than CallSitesPoly targets, else at CallSitesMaxHits hits or 16 targets. Cost lands early
; in a load, then ~0: "callsites min N" lines and cpTrapUs / cpLateUs give the trap time. tools/harness/queue.ts turns it on
; for correctness jobs (not timing profile jobs, opt out with job "callSites": false) and merges the "vcall" lines into
; probe-out/callsites/db.json (tools/callsite-db.ts). OFF in the shipped ini.
Enabled=0
PerWindow=16
WindowSec=30
DelaySec=90
Threads=0
CallSites=0
CallSitesMinHits=32
CallSitesPoly=4
CallSitesMaxHits=256
CallSitesWarmMin=10

[ProbeValues]
