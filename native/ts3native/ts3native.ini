; lot's rebase until the diff has run on the drifted clone, so the diff names the only-live / clone-only entries; at most
; one cut (then released, counted as timeout), one hold per lot in a row. Counters v111 rpHold (0 held, 1 released by the
; diff, 2 by timeout). Correctness jobs only: the held lot stays wrong in the clone for that cut. 0 = off.
AuditHoldRebase=0
ReplayCapMB=128
