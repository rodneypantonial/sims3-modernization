; Player setting: how long (ms) the game may spend on one route search for a Sim you cannot see before it gives up
; (175-300, default 300; values outside are clamped, the log says so). Lower = fewer and shorter hitches from off-screen
; Sims, but more of them get their walk cancelled or are moved to their goal; higher = more of their routes planned for
; real. Lowest 175, highest 300.
DeadlineMs=300
; 0.36.90 (docs/202 §3.4, counters v139 ufc*), OFF until verified (tools/harness/queues/unseen-fallback-c.json). Live mode
; only, unseen Sims only (ts3fixes switch "unseenfbsites" pushes their ids; no fresh list = nothing acts): when such a Sim's
; step would wait for a running route job's routing lock at C1 the steering obstacle list, C2 avoidance (RouteFollow_A), C3
; IsSlotUnobstructed / IsRouteToObjectUnobstructed or C4 a FindGoodLocation placing that Sim, it waits at most SiteWaitMs;
; then that step is skipped with a harmless answer (C1 no obstacles this tick, C2 nothing to avoid, C3 "obstructed", C4
; "spot not free"). One wait per running job: later asks during that job only try. Needs [RouteAsync]. C1..C4 pick sites
; (each 1 when Sites=1). Start value of ufcMode (+0x5390, --ab unseenfbc); SiteWaitMs 0-150 (0 = try once; value
; unseenfbcms). Minute line "unseen fallback sites: ...". 0.36.104 (docs/202 §5.6): default 0 (a fake answer is
; acceptable for an unseen Sim; 100 cost ~8 ms/s of sim waits in v020-natural IP); the list lives 3 s (ts3fixes pushes
; every ~0.5 s); C4 answers "not free" at most 8 times per Sim per second, then that Sim gets the game's own answer.
Sites=0
SiteWaitMs=0
C1=1
C2=1
C3=1
C4=1
; 0.36.105 (docs/202 §3.4.2, counters v140 ufw*), OFF until verified (unseen-fallback-c.json sv-ufw-* / ip-ufw-*). Needs
; Sites=1 with C1 or C2. "Finish the walk": instead of C1 / C2's fake answers, an unseen walker that ts3fixes
; (switch "unseenfbfinish") flags as finishable (one open walking subpath left, its end out of view and on no lot with a
; household Sim) is held where it stands while the routing lock is busy; ts3fixes waits its remaining walk time, then
; ends the route as arrived and places the Sim at its path end. Every other unseen Sim gets the game's own wait (no fake).
; A hold ends by itself (the Sim walks on) when the Sim comes into view, drops off the list, ts3fixes does not claim it
; within 3 s, after 10 min, or with the switch off. Start value of ufwMode (+0x5440, --ab unseenfbfinish).
; Minute line "unseen fallback finish walk: ...".
FinishWalk=0

[PlanRepeat]
; Plan cache probe (docs/23 §18, 0.32.10, counters v60 pr*), observe only: at Route_PlanLocked 0x82C6E0 it keys each plan
; (world, agent, follower, options and route lists, raw start and goal records) and keeps a 4096-plan ring with the world
; version after each plan; counts exact repeats (same key, no routing change) within 1 / 5 / 30 s and their plan time,
; repeats where only per-object footprints changed, repeats after other changes, and whether a repeat got the same path.
; Split by route IC (Plan, Replan, PlanFromPoint, ReplanFromPosition, sim outside an IC, other thread). Turns on the
; Route_PlanLocked detour and the [RouteSnap] Count=1 change counters (its world version). Log lines "plan repeat ..."
; every 60 s; report: node tools/harness/plan-repeat-report.ts <native.json>.
Enabled=0

[MonoFast]
; docs/139 §8 (0.36.127, mintcall.cpp; counters v143): own mint handlers for call, callvirt (inline-cache hit), ret and
; ret.void. Every case EA's path treats differently (new frame slot, transform, native body, arena chunk change, depth
; limit, value-type receiver, cache miss, exception, newobj, yield) goes to EA's handler unchanged; otherwise the same
; words are written in one pass. Refuses when EA's call path bytes are not the stock ones (e.g. [GcRootCheck] TailWatch).
; CallPath=1: fast path (the harness flips it per arm: --ab mintcall); CallPath=2: verify (every VerifyEvery-th eligible
; call also runs EA's handler from the same state and the result is compared: mcMismatch must stay 0; heavy, correctness
; runs only, no timing). Default off.
CallPath=0
VerifyEvery=16

[AutShadow]
; Autonomy meta-scoring shadow pilot, part 1 (docs/122 §13; export ts3native_autshadow, docs/registry.md): guard thunks on
; every IC provider-table slot (pass-through on every thread but the shadow worker), the snapshot builder with change
; tracking from [RouteSnap]'s World_FireEvent detour (needs [RouteSnap] Count=1, else every cut rebuilds in full) and our
; own object-event nodes, and the F2 worker abort at String.ParseFormatSpecifier 0xDA9790. Guard=all (every name) or
; closure (only the docs/122 §3.2 ICs). Audit=N: every Nth cut also checks the incremental snapshot against fresh body calls.
; Part 2 (docs/122 §14): needs [MonoThread] Enabled=1 (the cut rides its Simulate slot stub) and ts3fixes with switch
; autshadow on (the request hook). Mode=0 cut and count only; 1 = R: the sim thread re-scores each sampled request at the
; cut (script RNG saved and restored) and the M5 worker scores it from the snapshot ([MonoThread] Mode=1 GcLock=1
; FrameTls=1), ts3fixes compares bit for bit; 2 = W: worker only (reference for the first WarmIn requests of a load).
; Sample=N: 1 in N meta searches. Records: autshadow.jsonl next to this file. DumpOnMismatch: passed to ts3fixes.
; Ledger=1: mono ledger probe (autledger.cpp, docs/51; queue mono-ledger-probe.json): counts the RNG, slot position and
; the two object-query ICs inside the game's meta searches (ts3fixes switch autledger opens the scopes), their Mono classes
; and managed callers, [0x11DC18C] per Simulate tick and a Sleep(0)/Sleep(1) resume test; needs [MonoThread] Enabled=1.
; Measurement only (every call runs the game's body); counters ts3native_autshadow v3.
Enabled=0
Guard=all
Audit=50
Mode=0
Sample=4
WarmIn=20
DumpOnMismatch=0
Ledger=0
; ColdIc=1 (docs/122 §14.15): stale rows of ICs the worker has not read for 1,000 cuts are not refreshed at the cut
; (published cold: a worker read aborts and makes the IC hot from the next cut). Shadow cut cost only; 0 = refresh all.
ColdIc=0
; CutLean=1 (docs/122 §14.16; 2 = dirty lots, below): a per-lot list row is refreshed only when the lot's walker input (lot vector, world-lot
; objects on the lot, rooms for room queries) changed; aging every 8th cut. Shadow cut cost only.
CutLean=0
; TierMs=N (docs/122 §14.16): far unseen Sims (the [UnseenThrottle] rule plus ts3fixes' household viewers) get their rows
; refreshed at most every N ms; in between they are stale (a worker read aborts, the game scores it). 0 = off.
TierMs=0
; CutLean=2 (docs/122 §14.17): list rows are re-checked only when an object event moved an object onto, off or within
; (room) their lot; ListAudit=N list rows per cut are compared with a fresh body call: a miss distrusts every list row for
; one cut (worker reads abort) and falls back to CutLean=1 for the session. With TierMs: dirty lists of lots with no
; tier-1 Sim wait up to TierMs (distrusted), a worker read holds the lot at tier 1. Shadow cut cost only.
ListAudit=1
; TierClassMs=N (docs/122 §14.17): a Sim's tier is kept N ms (or until the camera moves 8 m) before it is classified again.
TierClassMs=1000
; RowHot=N (docs/122 §14.19): an object row the worker has not read for N cuts is not refreshed and is published cold (a
; worker read aborts, the game scores that pair, the row is refreshed from the next cut). The actors' rows and the parent
; rows are always refreshed. 0 = off (16-100,000). Shadow cut cost only.
RowHot=0
; RunSkip=1 (docs/122 §14.21): the cut skips runs of a clean object's rows whole (nothing can change their outcome) and
; publishes only the rows it walked since a version's last publish. Same answers; shadow cut cost only. 0 = off.
RunSkip=0
; FreshEvery=N (docs/122 §14.21, docs/124 §15): Mode R only, 1 in N finishes re-scores the request on the sim thread
; (>= 1 tick after the cut, script RNG put back) and counts pairs and top picks that differ from the worker's. 0 = off.
FreshEvery=0
; KeepPartial=1 (docs/122 §14.21): a worker run stopped at the window close keeps the meta objects it finished before the
; stop (compared in Mode R; the object it was inside of and the rest abort `stop`); 0 = the whole search falls back.
KeepPartial=0
; Satb (docs/206 §7, Mode >= 1 and [MonoThread] only): copy on first write so the worker can read the cut while the sim
; runs on. 1 = probe (S0): counts the sim's stores, first-written words and loads for one worker-job length of the tick
; after each job; the worker still runs only in the window (WindowWaitUs as before). 2 = act: the worker runs on through
; the next ticks and reads cut values through the log (no window wait, no stop at the window close); an unknown store
; path stops the worker first. Run 2 only after the probe passed the docs/206 §5 gate. 0 = off.
Satb=0
; Mode=3 = go-live (docs/124 §17): the game uses the worker's meta scores. Needs ts3fixes switches autshadow + autlive
; (off = the game's search, no request). The B13 hook posts, yields until the result is ready, then the B14 hook sends the
; worker's top TopN passing pairs (plus off-list ads, live objects) through the game's C1; bands by the §16.1 rule. The
; keys below are read only with Mode=3. VerifyEvery=N: every Nth cut also runs the sim-thread reference (Mode R compare;
; an A2/A3 turns go-live off for the session), 0 = never. Dry=1 (G7): compute what consume would pick, compare it with
; the game's own search, use nothing. MaxWait = ticks the search may wait for the result (then the game's B13 runs).
; Margin is per mille (0 = the exact rule). Bands = bands incl. band 1 before every remaining pair goes through C1.
TopN=10
Bands=3
Margin=0
MaxWait=3
VerifyEvery=50
Dry=0

[WorldImage]
; Mono M3.1 world image capture (docs/123 §8). At the return of MonoScriptHost_Simulate, every 30 ticks, a file named
; "request" in OutDir starts one capture: the helper worldimage.exe (native/worldimage) suspends the game, writes
; OutDir\wi-<UTC time>-<n>\ (~2 GB: header.txt, mem.bin) and resumes. Stalls the game seconds per capture: capture
; jobs only, never timing runs. Images hold personal data: keep OutDir under <repo>\game-copy\worldimage. OFF by default.
Enabled=0
OutDir=
; empty = worldimage.exe next to ts3native.asi
Helper=
MaxCaptures=5

[CrashReport]
; Opt-in crash report for players (0.36.7, crashreport.cpp, docs/135). On a crash, writes a text report to
; Documents\Electronic Arts\The Sims 3\ts3native-crashes\ (version, exe SHA-256, enabled sections, fault module+offset,
; registers, a module+offset stack, the last 50 ts3native.log lines, package file names, CPU/RAM/OS); user paths, the
; user name and the machine name are scrubbed. A session that ends without a clean exit and without a report leaves
; running.txt behind, and the next start writes a "hard" report. Nothing is sent from the game: `node tools/report-crash.ts`
; shows the report and sends it only after you confirm (your own gh login, or a prefilled GitHub issue page). OFF until tested.
Enabled=0

[P6Waits]
; 0.36.57 (docs/189 phase 0, counters v123, p6wait.cpp): the sim thread's job waits by arm (the P6 switch at the job's start), job
; outcome and waiter class, log only. Default 0 since 0.36.63 (the P6 queues set it); no runtime switch (counters, ini only).
Enabled=0

[ResourceCache]
; EXPERIMENT (0.36.80, docs/198 §4, counters v136 rt*, rctrim.cpp), off; never a release default: ResourceCache is Apex
; Radiance's area. 1 = call the game's own shrink of both ResourceSystem caches (0x733E70: every idle, unreferenced
; entry dropped) on the main thread right after the ResourceSystem service update, 2 s after each world load (needs
; [UserDiag]; travel arrival = a load with a new world name) and every TrimEveryMin minutes of play (0 = off, max 600).
; One "rctrim:" line per trim: cache held/idle before -> after, freed, private bytes, commit, largest free, ms. Stands down
; when Apex Radiance is loaded and [Compat] ApexStandDown=1. Overwatch nightly trigger not built (no ts3fixes signal).
TrimAfterCleanup=0
TrimEveryMin=0

[EaCrashFixes]
; Fixes for EA's own lifetime bugs (0.36.121, eafix.cpp, docs/67 §26.4 / §27.5, counters v141 ca* / tp*). OFF until tested.
; ConformActor=1 (issue #98, crash V): before a route-follow body asks an animation controller's actor whether the
; controller still runs (0x84EAC6, 0x849591, 0x85352A), checks that the actor is alive: a set of live AnimationComponents
; (their constructor and destructor call sites) plus the actor's vtable word. A destroyed or freed actor gets the game's
; own "controller done" answer, so the game drops that controller instead of calling through freed memory. Live actors
; and other actor types get the game's own call. One "ea fix: ConformActor" line for each of the first 8 skips.
; ThumbPose=1 (issue #99, crash W): the Sim thumbnail render (0xD59C10, lookup branch) keeps its reference to the pose's
; owner until the pose is evaluated, instead of releasing it just before.
ConformActor=0
ThumbPose=0
