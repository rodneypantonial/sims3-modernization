[OptsInit]
; I-94-322 (docs/94 §21.16, 0.34.1): the planner's search options (ctor 0x652BF0) leave the start / goal lot hub references
; +4 / +0x34 unset for a start or goal on open ground, and the world A* costs read +0x34: the answer then depends on the stack
; an earlier call left (a real uninitialised read in the game). Enabled=1 starts both at 0 (what a cleared stack gives), so
; a P4 shadow and the job see the same; it can change the game's own path where the stack happened to hold a hub. Default
; on since 2026-10-19 (Rodney: fix the game bug for everyone; Enabled=2 left 2 door-pair M2s per BP run). Enabled=2 (0.35.2) zeroes them only inside a clone run (P4 shadows, P5 runs): the game's own plans
