; chunk ends in EA's GC descriptor right after the last frame byte, and a frame that overruns its declared size there
; zeroes it, so the collector skips that chunk's frames and frees what they hold. 1 = six byte patches in EA's arena code
; keep 64 bytes between the frame area and the descriptor (pool chunk end 0x7FC -> 0x7BC, own chunks sized +64). Applied at
; load, all or none. Minute line "arena tail:".
TailPad=1
; InitobjFix (docs/67 §22.9, 0.36.102, OFF until its run; independent of Enabled): the Crash S writer. EA's interpreter
; zeroes 12 bytes for `initobj` on an Int64/UInt64/Double slot of 8 (e.g. List<ulong>.RemoveAt's default(T)), 4 past the
; slot: at a chunk's last frame that is the GC descriptor. 1 = the transform's size call (0xE63427) takes the smaller of
; EA's size and the storage size. Log line "initobj size:".
InitobjFix=1

