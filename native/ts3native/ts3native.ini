TailWatch=0

[ArenaGuard]
; docs/67 §22.2 (0.36.95, OFF until its run): EA's interpreter frame-arena pool can hold a chunk twice (a task that ends
; by a managed exception is released twice, docs/120 §9.1); a second state then gets a chunk a yielded task still uses and
; overwrites its locals, so the GC frees what only those slots held (Crash S shape). 1 = clear the state's chain after
; release-all and drop pooled chunks that are in use before each grow ([MonoThread] ArenaFix without the worker; skipped
; when [MonoThread] GcLock=1 owns the sites). Minute line "arena guard:"; counts in ts3native_mtprobe.
Enabled=0
