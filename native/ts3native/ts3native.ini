Enabled=0
Mode=0
CutMs=250
AuditEvery=20
CapMB=64
LogMismatch=32
; Lots=replay is phase P3-B (0.28.0, counters v49 rp*, replay.cpp; docs/94 §11 design B, §16), audit only, needs Enabled=1:
; a private clone of the lot planner (footprint map, lot table, quadtrees, FootprintMapEntries, footprints) built at world
; event 7; P1's apply leaves W1/W2 append one record each to a ring (inserts carry a footprint copy made right there), the
; cut rebases lots whose shape changed, and the "snap replay" thread applies the records with the game's own ApplyInsert /
; ApplyRemove on the clone under +0x918. Every ReplayAuditEvery cuts every live lot is hashed at the cut and compared with
; the clone at the same record (rpAudits / rpMis; "snap replay audit MISMATCH" lines). ReplayCapMB: clone memory cap,
; switches off above it. No search reads the clone (that is P4). Report: snap-audit-report.ts (replay rows). OFF by default.
; Prebuild=1 (with Lots=replay): at world event 7 every lot graph in the planner's table is built at once (the game's own
; first-use path, RoomGraph_FirstUse), so no lazy lot build and no lot rebase happens in play (rpPrebuilt, rpPrebuildKB).
Lots=none
ReplayAuditEvery=4
; ReplayAuditLots: lots hashed per audit cut, rotating through the table (0 = every lot; 0.30.1 hashed all 82 BP lots,
; ~97 ms on the sim per audit cut). 2 keeps >= 200 lot audits in a 10-min run at ~2.4 ms per audit cut.
ReplayAuditLots=2
