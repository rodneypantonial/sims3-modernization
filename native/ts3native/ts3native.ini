[UnseenFallback]
; 0.36.89 (docs/202, counters v138 uf*), OFF until verified (tools/harness/queues/unseen-fallback.json). Live mode only, decided
; by ts3fixes (switch "unseenfbplan"): a route plan or route job whose Sim the player cannot see is cut at DeadlineMs (ms from
; its start; 175-300) through the same no-path exits as [RouteAsync] PlanDeadlineMs, so nothing waits long behind an unseen
; Sim's routing. Needs [RouteAsync] (route IC hooks) and installs the deadline exits itself. Start value of ufMode (+0x5360,
; --ab unseenfb). Minute line "unseen fallback: ...".
