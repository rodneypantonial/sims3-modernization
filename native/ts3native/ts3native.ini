Enabled=0

[RouteSnap]
; Routing snapshot (docs/94). Count=1 is phase P1 (0.25.0, counters v46 sn*), observe only: pass-through counters on the
; routing writer leaves (W1-W6, footprint, R blocked bits, footprint grid, high-cost maps, G builds, blend reload) by
; thread class and source (IC slot, World_FireEvent, object event, Footprint_SetEnabled), 39 IC binding slots, world
; events by id, object-event nodes, dirty lots per route START. Sites another of our stubs owns ([SteerRO], [RouteGate],
; [ProbeValues]) are counted from inside it. Report: node tools/harness/snap-counters-report.ts <native.json> (gate G1).
; From 0.27.0 (P1b, counters v48, docs/94 §15) also six attribution frames, the design D drain and W6 cache-fill classes,
; a 64-key caller table, design B record rates per second and their copy cost, and timed lot copies after lot graph builds.
; OFF unless a probe job turns it on.
Count=0
; Enabled=1 is phase P3 (0.26.0, counters v47 sp*, snap.cpp): snapshot H images (R, G cells and passability, high-cost
; tiles, blockedNodeMap, footprint grid, blend layer 0, tuning; per-lot footprint images are a pluggable strategy, none in
; this build, docs/94 §11) cut at a route START on the sim thread
; under +0x918 (never while an async job runs), shared between versions, rebuilt only when P1's leaves mark them dirty.
; It installs P1's sites as Count=1 does. Mode=0 = audit only (no search reads the images; Mode=2 is P5, below).
; Mode=1 is P4 part A (0.29.0, counters v50, p4.cpp, docs/94 §12, §17, §18): shadow of async jobs on the working copy.
; Installs the T1-T4 stamp / clip / world-root thunks and the door replay at 0x64F4D3; after each shadowed job publishes
; its result, the worker runs the game's Route_PlanLocked on the clone, compares, and writes one JSON line to
; ts3native-shadow.jsonl (docs/94 §13 v2; node tools/harness/shadow-compare-report.ts). The game's answer is always kept.
; Needs [RouteAsync], [RouteGate] Enabled=1 Sites=1 Enforce=1. The clone comes from Lots=replay (P4 part B, p4clone.cpp,
; counters v51, docs/94 §21: each armed START cuts, the worker plans on a working copy of that cut); without Lots=replay
; every shadow is refused "clone" (M4). Private pools: a separate build (docs/94 §16.6).
; ShadowEvery: 1 job in N; Kinds: bit mask of A10 kinds (1 Plan, 2 Replan, 4 PlanFromPoint,
; 8 ReplanFromPosition); ShadowWorld: world tag written into each record (BP, IP, ...).
; ShadowObst=1 (0.35.4, docs/94 §21.19): a final M2/M3 record gets "obst", the footprints near both answers from the
; clone and from the live map (one +0x918 try on the worker, no wait); 0 = off.
; 0.36.50 (docs/94 §24.8.4): "obst" lists a footprint whose points reach the world box or the box in the start lot's frame
; (each entry says which: "w" / "l") with its lock-key set fp+0x20, plus "walkC"/"walkL" (footprints walked, 4 nearest).
; M2LotDump=1 (0.36.50, counters v121, p4lotdump.h, log-only, off by default): an M2/M3 record also gets "lotdump", every
; quadtree leaf entry of the start lot near both answers, clone and live (one +0x918 try), paired with a diff line per
; entry that differs (lock keys, key origin, masks, points, +0x34, or only one side); at most M2LotDumpMax (16) records.
; M2Box=x0,z0,x1,z1 also dumps compares whose start or goal (x, z) lies in the box, matched or not.
; Mode=2 is P5 (0.33.0, counters v61, p5.cpp, docs/94 §19, §22): everything Mode=1 installs, but for async
; ReplanFromPosition jobs (Kinds bit 8; [RouteAsync] Kinds must have 4) the game TAKES the clone run's answer instead of
; running its own plan. Door asks of the clone run go to the game's own chain on the sim thread (as A10). Any refusal, stop,
; fault, tripwire, stale cut or non-routing write in the window runs the game's plan for that request instead. VerifyEvery:
; 1 job in N runs both, keeps the game's answer and writes a record (v3, "m2":1) for shadow-compare-report.ts. Mode=2 turns
; itself off for the session on a foreign hook at one of our sites, 3 clone-run tripwires or a fault ("RouteSnap: Mode=2 off").
; Runtime switch m2Take (`--ab routesnap`). Report: snap-audit-report.ts (P5 lines). OFF unless a P5 job sets Mode=2.
VerifyEvery=10
; VerifyLend=1 (0.36.23, docs/94 §22.32): verify jobs also run their clone run in the P5b / P5c lent window (ReleaseLock /
; FreeLock), so a verify run proves answers under the window; a P5c stale answer is then compared as time skew (M5) instead
; of refused. 0 = verify jobs keep the job's +0x918 (as before). Correctness runs only.
VerifyLend=0
; ReleaseLock=1 is P5b (0.34.0, counters v62, p5b.cpp, docs/94 §22.9), only with Mode=2: while a taken job's clone run runs,
; the job's routing lock +0x918 is lent to the sim's steering calls (0x82EDB0 / 0x82F0B0); every other acquire still waits
; for the job, and destroys, saves and closing still wait for it. The worker takes the lock back before the answer is moved,
; before each door ask (lent out again after it) and at any tripwire. Needs [RouteGate] Sites=1 Enforce=1. Runtime switch
; p5bRelease (`--ab routesnaprel`). OFF by default.
ReleaseLock=0
; ReleaseGates=1 (0.34.2, counters v63, docs/94 §22.10), only with ReleaseLock=1: the lent lock also goes to the sim's
; read-only gate leaves: LotTable_Contains for the front door, placement and slot position callers (not the footprint
; rebuild or portal writer callers) and LotTable_GetOrInsert hits (a miss gives the lock back and waits). Writers,
; destroys and sync plans still wait. Runtime switch p5bGates (`--ab routesnapgate`). OFF by default.
ReleaseGates=0
; FreeLock=1 is P5c (0.35.0, counters v65, p5c.cpp, docs/94 §22.11), only with ReleaseLock=1: while a taken job's clone run
; runs, the lent lock goes to every plain +0x918 acquire of the sim (writers too, not only steering); gate waits keep the
; ReleaseGates rules (sync plans, lot planner gates and gate-0 misses still wait). A destroy in that window parks one
; reference to its object and runs at once; parked references are released when no job runs. An answer whose cut has a
; routing write after it is refused and the game's own plan answers. Runtime switch p5cFree (`--ab routesnapfree`). OFF.
FreeLock=0
; TakeKinds (0.36.41, counters v112, docs/94 §24, P6): the job kinds Mode=2 takes answers for, ANDed with Kinds: 8 =
; ReplanFromPosition (default, P5 as before), 9 = also the Sims' own Route.Plan jobs (FallbackAsync foreign plans never).
; ShareCuts=1: a Mode=2 START while a job is queued or running borrows the newest pending cut instead of getting none
; (only with no recorded routing write since that cut and no lot updates pending); missing key = on when TakeKinds has 1.
; Runtime switches p6Plan (Route.Plan taken, `--ab routesnapplan`) and p6Share (`--ab routesnapshare`). OFF by default (8 / 0).
TakeKinds=8
ShareCuts=0
; AskLent (0.36.60, counters v126 au*, docs/189 phase 3), only with FreeLock=1: a taken clone job's door ask (event 59, proxied
; to the sim) goes out with +0x918 still lent instead of the retake / reopen pair; the ask's callback takes the real lock and
; plans nested in it plan on the sim; any recorded routing write meanwhile refuses the answer (P5cStale). Runtime switch auMode
; (+0x4FFC, `--ab asklent`), read at each ask. OFF.
AskLent=0
; DoorMemoX (0.36.60, counters v126 dmx*, docs/189 phase 3, hostcalls.cpp): cross-job door answer memo. An ask whose key
; another job's ask answered "unlocked" within DoorMemoXMs gets that answer while no portal IC, epoch / lot world event or
; event 59 delegate change happened since. -1 = not installed, 0 = installed off, 1 = memo, 2 = shadow (ask anyway, compare:
; dmxMismatch must stay 0). Runtime switch dmxMode (+0x5014, `--ab doormemox`; a flip clears the table). Install with 0 for
; in-load A/B. OFF.
DoorMemoX=-1
DoorMemoXMs=250
; P6LogMs (0.36.41, docs/94 §24.7): one "P6 job" log line (phase split: queue, start, rpwait, copy, clone, game, other, cut
; age, door asks, lazy builds, plans) per armed Route.Plan job at least this slow, 20 lines a minute at most; 0 = off.
; Count / log only: the p6j* counters are kept either way.
P6LogMs=20
; P6EarlyCopy (0.36.56, counters v122, docs/94 §24.14): 1 = an armed Mode=2 job whose acquire makes no game call (own-only)
; copies the clone on the worker before it takes +0x918, so the copy is no longer part of the job's running span (gate
; waits on A_RUNNING); the plan re-checks the epoch, active lot and clone flags under the hold. Runtime switch routesnapearly.
P6EarlyCopy=0
; StaleLot (0.36.59, counters v125, docs/189 phase 2, docs/94 §24.16): per-lot staleness. 0 = off (nothing installed);
; 2 = shadow (write ring + LotTable_Find read-set detour installed; both verdicts counted, the global rule acts); 1 = acting
; (a job stale only by lot-keyed writes to lots its clone run did not look up is taken). The read set is NOT proven complete:
; run shadow with VerifyEvery=1 first; a per-lot-only verify mismatch turns acting off for the session. Runtime switch
; routesnapstalelot (0 / 1 / 2) when installed.
StaleLot=0
