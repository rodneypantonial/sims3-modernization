; ts3native.asi settings. Changes apply at the next game start. See docs/15-native-patches.md.
[GC]
; 0 = apply no GC patches
Enabled=1
; Boehm initial heap (game default 40; 352 measured in Bridgeport 2026-10-12: forced GCs 128 -> 1 in 6 min). Range 40-1024. The env var GC_INITIAL_HEAP_SIZE overrides it.
InitialHeapMB=352
; Max heap growth per expansion (game default 8). Range 8-256.
GrowthStepMB=32
; Per-frame GC budget ceiling (game default 1500, probably microseconds). 0 = unchanged. Range 500-20000.
BudgetCeiling=0

[Compat]
; Apex Radiance (docs/148 §7, apex.cpp): when ApexRadiance.asi (or zzApexRadiance.asi, or its instance mutex) is loaded at
; start, our modules on a site Apex owns stay out while the Apex switch is on in its ApexRadiance.toml (missing = Apex's
; default): [IdCache] and [Verify] id/lot-lookup probes (ObjectLookupIndex), [SaveCompress] (FastCacheCompression),
; [FootprintIndex] and the [SaveWrite] timing call 0xAB12AF (MemoryGuard = Room to Save), [LotStream] and [Verify] lot
; probes (Lot* switches), [Verify] package probes (ResourceLookupCache, FileListCache). Log: "compat: stood down for Apex".
; 0 = install ours anyway (tests; Apex's switch on the same site then stays off).
ApexStandDown=1

[ThreadStack]
; Smaller stack reservations for threads TS3W.exe starts itself (docs/66 §6, threadstack.cpp): the exe's IAT slots for
; CreateThread and _beginthreadex. Every exe thread reserves the PE default 1 MB today (all 7 call sites pass 0 or a commit
; size). DLL threads (DXVK, driver, S3SS, S3PP, ours) are not touched. Address space only. OFF until the addr-quickwins A/B.
Enabled=0
; Reservation per thread when the caller asks for less (and did not ask for a reservation itself). 0 = observe only: log
; every start with its real reservation, change nothing. Range 128-1024 (1024 = no change with the 1 MB PE default).
ReserveKB=512
; Hex start addresses (or EAThread user functions) that keep the game's stack. Default: SimulatorThread_Proc 0x76B470
; (Mono interpreter, deep native recursion). Up to 8, comma separated.
Skip=0x76B470
; Log lines for the first N thread starts (start, user function, asked size, real reservation read from the TEB).
LogThreads=64

[Watchpoint]
; docs/157 §8: hardware data watchpoints (DR0-DR3 on every thread) for correctness jobs only; code arms them through WpArm
; at the hook where the watched object is made, and the handler logs each write (eip, value, thread, stack). Off: nothing
; is installed. Not for timing runs (each arm suspends every thread once).
Enabled=0
; Logged hits per register (later hits are counted only).
LogHits=16

[RouteCache]
; Negative cache for failed route plans at Route_PlanLocked 0x82C6E0 (docs/15 phase 2). Off: tested in game 2026-10-14, 12 hits in 6,681 plans (0.2%), no gain.
Enabled=0
; A no-path failure answers the same request (follower, options, start and goal points in 0.5 m cells) with a plain failure for this long, real time. Range 100-60000.
WindowMs=2000
; Table size (rounded up to a power of two). Range 256-65536.
MaxEntries=4096

[RouteWorker]
; Route search on a worker thread while the calling (sim) thread waits (docs/18 first step, "offload-sync"): same arguments
; and result, only the thread changes. Uses the same Route_PlanLocked 0x82C6E0 detour as the cache and works with it. OFF until verified in game.
; 1 = start the worker thread and install the detour.
Enabled=0
; Start value of the runtime switch (ts3native_counters.workerMode; the probe flips it: /native?routeworker=0|1). 0 = plan on the calling thread, 1 = on the worker.
Mode=0

[RouteAsync]
; Async route plan (docs/18 "Async plan"): a plan from a Sim's own yielding task (asked by the ts3fixes Route.Plan hook) runs
; on the worker thread while the sim thread goes on and the Sim's task sleeps tick by tick until the result is ready.
; Detours IC_Route_Plan 0x765160, Route_GetOption 0x74D040 and Lock_Acquire 0x4E16F0, starts the worker and installs the
; Route_PlanLocked detour (worker Mode stays as set above). Needs ts3fixes with the async hook.
; 0.11.0 (H6 S3b + M1): START is refused unless [RouteGate] Enabled=1, Sites=1 and Enforce=1 are all installed (the
; worker then holds the routing lock world+0x918 for the whole job; docs/60 2.3/2.4). Without them async never starts.
; 0.36.0 (release v0.1.4): ON by default with [RouteGate] Enabled/Sites/Enforce=1 and [Discourage] Enabled=1 (env-on
; runs: sim route time 119 -> 50 ms/s, +10-12% iterations/s, PLAN.md H6 state). Kinds stays 0 (A10 replans not released).
Enabled=1
; Start value of the runtime switch (ts3native_counters.asyncMode; /native?routeasync=0|1). 0 = plans stay synchronous, 1 = async.
Mode=1
; 0.17.0 (counters v35 rfb*, docs/60 §2.3), observe only: in Mode 1, sync route plans on the sim thread are timed; those
; >= 50 ms are counted by reason group, those >= this many ms get a log line with the reason (max 20 lines/min). 0 = off.
LogFallbackMs=200
; 0.36.7 (docs/134, counters v73 fb*), OFF until an A/B in game (tools/harness/queues/freeze-fix-ab.json): fewer sync fallback
; plans on the sim thread (the multi-second freezes). 1 = (a) a Route.Plan from a yielding task that is not the route's Sim
; (ts3fixes 0.36.7+ sends a "foreign" START) runs on the worker while that task sleeps, unless the route is being followed;
; (b) M1Pending: the pending lot updates the plan would apply first are applied on the sim thread under one +0x918 try,
; then the START goes on; (c) the job queue is 32 deep instead of 8 (fewer QueueFull). 0 = today's behaviour; foreign
; STARTs are refused and their sync plans logged with reason "Foreign" instead of "NoStart".
; Start value of the runtime switch fbMode (+0x314C, --ab fallbackasync).
FallbackAsync=0
; docs/134 §2.6 (counters v75 fbRetry*), OFF until an A/B in game (tools/harness/queues/freeze-fix-ab2.json); needs
; FallbackAsync=1. 1 = an M1Pending START whose one +0x918 try failed (a job holds the lock) is answered yes and parked: the
; Sim's task sleeps tick by tick as for any async plan, and each of its READY polls tries the lock once more (after D's
; deferred footprints are applied), applies the pending lot updates and queues the job; after 30 ticks it gives up and the
; plan runs synchronously as before. Only task callers that may yield ever START; others are unchanged.
; Start value of the runtime switch fbRetryMode (+0x31C8, --ab m1retry).
M1Retry=0
; 0.36.7 (docs/134): cap, in ms, on the world A* of every sim-thread sync route plan while Mode=1 (any reason: NoStart,
; NoYield, Los, ...). Over the cap the search ends through its own exit as an ordinary no-path failure (the [RouteBudget]
; cost-function stubs, patched for this even with [RouteBudget] Enabled=0; worker plans are never capped here). Lot/portal
; searches are not capped. 0 = off. Range 50-60000. Changes results (a long plan fails): OFF until an A/B.
SyncCapMs=0
; 0.36.16 (docs/134 §10): cap, in ms, on the world A* of each foreign job (FallbackAsync=1: a plan from a task that is not
; the route's Sim, run on the worker). The sim thread waits out a running job at its next routing-lock acquire (steering,
; destroy), so one long job is a hitch of its length: clean-night-0.2.0 SV saw 1,017 and 522 ms jobs, OFF slices <= 295 ms.
; Same failure as SyncCapMs (no path). Own-task jobs are not capped. 0 = off. Range 50-60000. Changes results: OFF until an
; A/B. Logs every job >= 200 ms ("long job", foreign or own) whatever this is. Start value of fbjcMode (+0x354C, --ab fbjobcap).
FbJobCapMs=0
; 0.36.31 (docs/178 T1, counters v103 fbjd*), OFF until its SV crowd A/B (tools/harness/queues/route-t1.json): 1 = the
; FbJobCapMs deadline of a foreign job also cuts its cell A* 0x61E500 and water 0x671930 searches (the [PlanDeadlineMs] entry
; stubs' no-path exits, now also on the worker inside a foreign job), not only its world A*. SV crowd foreign jobs spent their
; time in cell A* (2.08 s, never cut). Needs FbJobCapMs > 0. Start value of fbjdMode (+0x440C, native_set fbjobdeadline /
; --ab fbjobdeadline) = 1. With [RouteJobPhases] Enabled=1 also one line per foreign job >= 300 ms ("route phases: foreign
; job N ms ...": self time by phase, searches cut per phase).
FbJobDeadline=0
; docs/178 T4 (counters v103 ow*), observe only: sim-thread waits behind an own (non-foreign, non-A10-foreign) job: count,
; time, max, histogram; waits >= 300 ms logged ("route jobs: sim waited N ms behind an own job").
OwnJobWait=0
; docs/183 (counters v109 jy*): 1 = JOBBUSY answers. ts3fixes (switch "jobyield") asks before a plan that would wait for a
; running route job (sync fallback plans, a START refused, the READY poll cap) and sleeps a tick at a time instead, so the
; sim thread keeps running everything else. Start value of jyMode (+0x45CC, native_set jobyield / --ab jobyield). The sim's
; job waits by site (sw*, "route jobs sim waits" line, waits >= 300 ms logged) are counted with either value.
JobYield=0
; 0.36.21 (docs/149, design H2 of docs/86, counters v85 h2*): 1 = no queued job starts while the sim thread runs the
; locomotion pass (Locomotion_Update 0x83CED0 from 0xD81C5C: steering, avoidance); held starts go right after the pass.
; Installs the [LocoWindow] thunk in Mode 1 (same code); start value of g0wMode (+0x13E8, --ab h2 / locowin; 0 = count only).
; OFF until the both-order A/B (tools/harness/queues/h2-ab.json).
H2=0
; docs/177 §4 (counters v102 hx*): 1 = the same start hold while the sim thread runs one of 7 script ICs that write footprint
; refcounts [fp+4] without a lock after their obstacle query (GetDestinationObstruction, GetObstructionAtPoint,
; IsPointObstructedBySim, FindObstaclesForSimAlongRoute, SetAGS, InsertRouteSubPathsAtIndex, InsertCustomPathAtIndex; IC
; binding slots, each checked). Closes the race with a job's goal validation / EditPath writes for jobs that start meanwhile.
; Needs [RouteGate] Enforce=1 with the async path. H2IcMode = start value of hxMode (+0x43D8, native_set h2ic / --ab h2ic).
; OFF until its A/B (tools/harness/queues/route-goal-ab.json).
H2Ic=0
H2IcMode=1
; docs/177 §7 (counters v104 rc*): 1 = footprint refcount guard. On the sim thread the obstacle query 0x82EDB0 and the goal
; footprint gather 0x82F0B0 keep their +0x918 level (release calls 0x82F098 / 0x82F45C) when they copied hits for one of
; their 12 game callers, until that caller returns; so the caller's plain [fp+4] +1/-1 and vector release never run beside a
; job (also with TailUnlock / P5b lends, which H2Ic leaves open). Every sim wait for the worker releases the kept levels first.
; Needs [RouteGate] Enabled=1 Sites=1 Enforce=1 (steering frames) with the async path. RefcountGuardMode = start value of
; rcMode (+0x44D4, native_set refcountguard / --ab refcountguard; 0 = count only). OFF until its runs
; (tools/harness/queues/refcount-guard.json).
RefcountGuard=1
RefcountGuardMode=1
; docs/150 §11 (counters v89 tu*), OFF until its A/B (tools/harness/queues/tailunlock.json): 1 = the route worker lends +0x918
; to the sim's steering while passes 16-19 of the node post pass 0x64E380 run (heights and portal flags on the job's own path;
; no routing state, docs/150 §11.1), as P5b does around a clone run, and takes it back with the game's Lock_Acquire after
; pass 19, when a pass fails, or at a tripwire (tuTrip). Needs [RouteGate] Enabled/Sites/Enforce=1. Installs 4 call-site
; retargets in 0x64E380; tuMode (+0x3878, --ab tailunlock) starts at 1.
TailUnlock=0
; docs/150 §13 (counters v90 rd*), OFF until its A/B (tools/harness/queues/replan-dedupe.json): repeated replans of one follower
; (IC_Route_Replan 0x765490, IC_Route_ReplanFromPosition 0x765550; through A10's collect detours when Kinds hooks them, else
; own detours). Counts repeats (same follower, IC, goal, start within 10 cm) by 250 / 500 / 1000 ms and result, and with the
; switch on answers a repeat of a FAILED plan within 500 ms with that result, without planning, when the route is as that plan
; left it and no routing write landed since (per-object footprint writes allowed unless the route is BlockedByPeople /
; BlockedByDynamicFootprints); never for result 18. Turns on the [RouteSnap] change counters (its world version).
; 0 = not installed, 1 = installed, rdMode (+0x38FC, --ab replandedupe) starts 1, 2 = installed, rdMode starts 0 (observe only).
ReplanDedupe=0
; 0.36.27 (docs/164 §7 D1-D4, counters v99 pd*), OFF until its loop A/B (tools/harness/queues/repro-check-route.json): one wall
; deadline, in ms, per sim-thread sync route plan (the route IC's sync path with goal step and every nested plan; a sim-thread
; Route_PlanLocked outside it: Replan / PlanFromPoint with A10 off). Past it every search of that plan answers as the game's own
; no-path exits do (world A* through the cost stubs, cell A* 0x61E500 and water 0x671930 at their entries), so the planner's own
; failure path runs and the plan fails as an ordinary no path. Plans that finish before the deadline are unchanged. This value
; applies to IC plans with reason NoStart / Foreign (no own task) and to non-IC sim plans; with it set, SyncCapMs's node clock
; is not used inside those plans. 0 = not installed. Range 50-60000. pdMode (+0x4244, native_set plandeadline) starts 1;
; pdUs (+0x4248, native_set plandeadlineus) holds the value in us.
PlanDeadlineMs=0
; the same deadline for IC plans of the route Sim's own task (every other reason: NoYield, QueueFull, M1*, Unstarted, ...): a
; Sim that must take that route would fail it instead. 0 = never cut those (default). pdOwnUs (+0x424C, plandeadlineownus).
PlanDeadlineOwnMs=0
; docs/164 §7 D5 (counters v99 fm*), OFF until its A/B: ReplanDedupe's check on the route IC Plan's sync path (SyncIc): a
; repeat of a FAILED plan within 500 ms (same follower, goal, start within 10 cm, route state as that plan left it, no routing
; write since) is answered with that result. Turns on the [RouteSnap] change counters. 0 = not installed, 1 = installed, fmMode
; (+0x4280, native_set failmemo) starts 1, 2 = installed, fmMode starts 0 (observe only: fmWouldSame / fmWouldDiff).
FailMemo=0
; docs/159 §4 H2 (counters v96 dm*, hostcalls.cpp), OFF until its A/B (tools/harness/queues/host-call-probe.json): door answer
; memo within one route job. A door ask at 0x64F4D3 (World_FirePortalLockedQuery 0x791C00, proxied to the sim thread) whose key
; (P4's door key: lot, Sim and portal owner ids, room pair, initialLocked) the same job already asked returns the first answer,
; with no round trip to the sim. Worker inside a job only; a plan nested in a managed call, a clone run, a full 64-row table or
; any other thread asks as today. 0 = not installed, 1 = memo (dmMode +0x408C, --ab doormemo, starts 1), 2 = shadow (repeats
; asked anyway and compared: dmMismatch must stay 0).
DoorMemo=0
; 0.36.7 (docs/134): after each "sync plan" log line, one more line with up to this many script (interpreter) frames of the
; sim thread, innermost first, naming the managed caller. 0 = off, max 16. Logging only.
LogFallbackStack=0
; 0.22.0 design A10 (docs/87 §5, counters v40 ar*), EXPERIMENTAL, never run in game: the Replan-family route ICs as async
; jobs too, through the same handshake (needs ts3fixes 0.22.0+ hooks on Route.Replan / PlanFromPoint / ReplanFromPoint).
; Bit mask of collect detours: 1 = IC_Route_Replan 0x765490, 2 = IC_Route_PlanFromPoint 0x765240, 4 =
; IC_Route_ReplanFromPosition 0x765550 (7 = all). 0 = nothing hooked, today's behaviour. A route being followed stays sync.
Kinds=0
; Start value of the runtime switch (ts3native_counters.arMode +0x14A8; --ab asyncreplan). 0 = shadow (every START check
; runs and is counted in arShadow, the plan stays synchronous), 1 = async.
KindsMode=1

[RouteBudget]
; Cap on one route search request (docs/15 phase 4): over budget, the world A* 0x676260 sees every further edge as blocked
; and fails through its own exit, i.e. an ordinary FailedBecauseNoPathToDestination. Needs the Route_PlanLocked detour
; (installed by this key too). Lot/portal searches (0x63E340) are not capped. OFF until verified in game.
; 1 = patch the A*'s five cost-function pointers (0x676340-0x676368) and install the detour.
Enabled=0
; Start value of the runtime switch (ts3native_counters.budgetMode; /native?routebudget=0|1). 0 = no cap, 1 = cap.
Mode=1
; Nodes generated per request (all A* runs inside one Route_PlanLocked, incl. its retries). 0 = no node cap. Range 1000-10000000.
; No default yet: set it above the budgetMaxNodesOk counter of an uncapped run.
MaxNodes=0
; Time per request, microseconds (checked every 16 nodes). 0 = no time cap. Range 5000-2000000.
; 100 ms = 4x the Isla Paradiso mean plan (25.4 ms) and 28x Bridgeport's (3.6 ms); BP's longest single search was 188 ms.
MaxUs=100000
; 1 = cap only routes with RouteOption DebugPathPlan (hi word bit 0x1) set, for a C# caller that marks unseen townies.
; Nothing sets that bit yet, so 1 means "cap nothing" today.
OnlyFlagged=0

[RouteJobPhases]
; Per-phase timers inside the route worker's jobs (docs/150 §7, counters v87), observe only: cell A*, post pass, path-node
; insert, world A*, lot legs, portal A*, candidate loops, LotGraph_Build, pending lot updates, water, allocator, Lock_Acquire,
; host-call waits, rest of the job; self time per phase and job kind (own START, own A10, foreign). Worker thread only: other
; threads pass the stubs with one compare. Adds two QPC reads per timed call to the job. Report: tools/harness/route-phases-report.ts
Enabled=0
; docs/159 §5 (counters v96 hc*, hostcalls.cpp), observe only, needs Enabled=1: each host call the worker proxies during a job
; split into queue per serve site (lock pump +0x918 / other lock, READY poll, job waits, sync plan wait), service, return and
; nested plans; queue time inside the frame-limiter window; door asks at 0x64F4D3 by key (repeats within a job and their wait,
; answer changes, same key from another job within 1 s). Installs the door stub (shared with [RouteAsync] DoorMemo).
HostSplit=0
; docs/164 (counters v97 syp*, syncphases.cpp), observe only, works without Enabled=1: the same timers on the sim thread's own
; sync plans (the [RouteAsync] sync path through the route IC, and every other Route_PlanLocked the sim runs: Replan with A10
; off, ThreadedObjects plans), the frames a player sees freeze. Per plan: phases, world A* calls by planner loop (goal-lot
; entry loop, open-ground goals, circle pre-pass), Route_PlanLocked result. One line "route phases: sync plan N ms ..." per
; plan >= [RouteAsync] LogFallbackMs (20 per minute). Costs one pushad + call per Route_PlanLocked on other threads, and two
; QPC reads per timed call inside a sync plan. Report: tools/harness/route-phases-report.ts --sync <ts3native.log>
SyncPlans=0
; docs/177 §5 probe P-G (counters v102 pg*), observe only, needs Enabled=1: four more worker phases, goal generation 0x751FF0,
; goal step 0x75C2D0, EditPathForRoute 0x85FF30 and GoalPoint_Validate 0x759B20 (counted per job); with it on, "rest of job"
; = v87 other + these four. One line "route phases: long rest N ms ..." per job whose rest is >= 50 ms (20 per minute).
GoalSplit=0
; docs/178 T3 probe P-GS (counters v103 gs*), observe only, needs GoalSplit=1: eight sites timed when called directly from the
; goal step (lot planner 0x63F490, room graph 0x63D2F0, LotPortalSearch 0x63EC40, Q reset 0x61E320, obstacle query 0x82EDB0,
; gather 0x82F0B0, range query 0x83B3A0, lot index rebuild 0xC68680; through [RouteGate] / its Sites stubs where present).
; One line "route phases: goal step N ms ..." per goal step >= 50 ms with the 8 sites, every other timed phase inside the step,
; the step's own code ("unattributed"; all add up to N) and its QPC window (20 per minute; 0.36.32, docs/178 §6.5).
GoalStepSplit=0

[GoalGen]
; docs/177 §3 design D1 (counters v102 gg*): a radius route (max radius <= min) builds its goal ring twice with the same inputs
; (ring count 1 at 0x75C05C, loop 0..count). 1 = install the thunk on the ring builder call 0x75C246 (the 8 bytes at 0x75C05C
; are checked first; refused and logged when they differ). Mode = start value of ggMode (+0x43B4, native_set goalgen / --ab
; goalgen): 0 count only, 1 skip the duplicate ring (validations -17 per radius route; same goal), 2 shadow (both rings run,
; arguments and, on worker jobs with [RouteJobPhases] GoalSplit=1, validation answers compared). BytePatch=1 also writes the
; immediate 1 -> 0 at 0x75C060 (release form, no runtime switch). OFF until its A/B (tools/harness/queues/route-goal-ab.json).
SameRing=0
Mode=1
BytePatch=0

[CellMemoProbe]
; docs/150 §12 (counters v88 cm*), observe only, needs [RouteJobPhases] Enabled=1: per worker plan (Q reset to Q reset), hashes
; each in-room leg request (InRoomPlan / InRoomPlanToPoint, design M's key) and counts repeats and the cell A* time they cost
; (cmHitCellUs = would-hit time if a within-plan leg memo existed). Nothing is cached.
Enabled=0

[RouteEarlyOut]
; No-path pre-check probe (docs/142, counters v78): observe only, every route result stays the game's. Detours the world A*
; 0x676260 (and the Route_PlanLocked detour for the request scope). Before each search it asks whether the search must fail
; (car-only components of R, the game's own flood colours, an earlier failed search of the same request with the same start
; and walls), lets the search run anyway and counts the time a real early-out would save; a proof that a path disproves
; counts eoWrong (expected 0, logged). One log line per request >= LogMs: world A* calls, fails, ms, provable calls and ms.
; Mode=2 (docs/142 §9, 0.36.22, counters v86): car and memo proofs answer the search without the flood: the context fields,
; *best and closed bits the game's failed search would leave, result 0. Colour proofs stay observe only. OFF: not run in game.
Enabled=0
; 1 = probe (observe only), 2 = act (needs Act=1; Act=0 = shadow: every proof answered both ways, the game's answer used), 0 =
; pass-through. The runtime switch ts3native_counters.eoMode (+0x3260, --ab earlyout) turns it on (1) or off (0) at this level.
Mode=1
Act=0
; Mode 2: the first ShadowFirst proofs and then every ShadowEvery-th are answered both ways and compared (eoActDiff); the first
; difference turns acting off for the session (eoActOff). MemoMinUs: a memo (with its wall print) only behind a failed search
; that took at least this long.
ShadowFirst=32
ShadowEvery=16
MemoMinUs=1000
; Requests at or above this many ms get a log line (20 per minute). Range 1-60000.
LogMs=200

[SaveWrite]
; Save timing and the old-save backup copy off the sim thread (docs/15 phase 7). Hooks six call sites of the native save
; FUN_00AB1030 and logs one line per save (total, package write, backup, copy, final flush). Verified in game 2026-10-14 (two saves, backup by the worker, save reloads); on in the stable build.
Enabled=1
; Start value of the runtime switch (ts3native_counters.saveMode). 0 = time only, the game backs up the old save itself;
; 1 = a worker copies the old save to <TS3 user folder>\ts3native-backup.tmp while the game writes the package, and the
; backup step renames it to <name>.sims3.backup (the game's own copy runs instead if anything does not match).
Mode=1

[Decompress]
; Faster RefPack decoder (docs/15 phase 6): retargets the one call to the decode core (call at 0x4EC065 -> 0x4EB3B0) to RefpackFast,
; same results and bytes as the game (offline test: 3.7 GB of shipped resources identical; 2.2x a C port of the game decoder, 1.8x S3SS RefPackDecompressor).
; Verified in game 2026-10-14: Verify=1 over a Bridgeport load, 33,121 calls, 0 mismatches; ~144k calls in 4 sessions, 0 fails. On in the stable build.
; Does not touch 0x4EB3B0, so S3SS's patch there stays as the mode-0 path. Logs calls, MB, ms and threads every 60 s.
Enabled=1
; Start value of the runtime switch (ts3native_counters.decompressMode): 0 = the code at 0x4EB3B0 (S3SS or the game), 1 = RefpackFast.
Mode=1
; 1 = mode 1 also decodes with 0x4EB3B0 into a scratch buffer and compares (counts mismatches, keeps that result). Slow: first runs only.
Verify=0

[Alloc]
; Per-thread cache in front of EA's general allocator (docs/15 phase 8): frees of chunks up to 1 KB are kept per thread and per
; heap and handed to the next Malloc of that size without the heap's lock and without 0x4E5E40. Detours Malloc 0x4E69D0,
; Memalign 0x4E6A20 (align <= 16, offset 0 only), Free 0x4E5920 and Shutdown 0x4E5CB0. Cached chunks stay allocated as far as the heap knows; no new memory is reserved.
; OFF until verified in game.
Enabled=0
; Start value of the runtime switch (ts3native_counters.allocMode): 0 = every call goes to the game, 1 = cache.
Mode=1
; Chunk bytes one thread may hold. Range 16-1024.
ThreadKB=64
; Total for all threads: MaxMB / ThreadKB threads get a cache, the rest run uncached. Range 1-32.
MaxMB=4
; Chunks per size (16-byte steps) per heap per thread. Range 4-256.
PerBin=32
; docs/67 crash lead: a second Free of a chunk this thread already caches would hand it to two owners. 1 = drop that Free (the
; first one still owns the chunk) and count it (allocDupFrees, counters v23); 0 = old behaviour, still counted. Runtime switch
; ts3native_counters.allocDedupe (+0xC1C, --ab allocdedupe). Same thread only. OFF until measured; keep Enabled=0 without it.
Dedupe=0

[WaterJps]
; Water-grid jump-point search (docs/15 phase 9): the jump 0x61FE10 of the boats/swimming route search 0x620560 (recursive, one call
; plus about ten helper calls per cell) runs as one inlined loop, WaterJump. Same results: 43.9M jumps on random grids identical to the
; game's own code (out\waterjps-test.exe), 3.9x faster offline. Retargets the call at 0x6207FB only; skips itself when the code there
; differs from Steam 1.67. Verified in game (Isla Paradiso, Verify=1: 5.4M calls, 0 mismatches); on in the stable build.
Enabled=1
