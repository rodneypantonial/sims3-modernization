# Builds ts3native and runs the checks that need no game files. A tag v* also drafts a GitHub release
# with ts3native and the matching CHANGELOG.md section. ts3fixes.package is not built here: it compiles
# against EA's assemblies, which must never be in the repo or in CI, so the maintainer attaches it to the draft.
name: build

on:
  push:
    branches: [main, ea169-port]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ts3native and run selftest.exe
        shell: cmd
        run: native\ts3native\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: ts3native
          path: |
            native/ts3native/out/ts3native.asi
            native/ts3native/out/ts3native.ini

  # EA app 1.69.47 build (docs/228): the same sources with /DTS3A_TABLE take their addresses from the committed
  # native/ts3native/ts3addr-ea169.h. No selftest.exe (not compile-checked under the table). The EA ini is the Steam ini with
  # every section off except the allowlist, and an allowlisted section's source file must not have a 0 (unresolved) row.
  native-ea169:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ts3native-ea169.asi (/DTS3A_TABLE)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (echo Visual Studio with the C++ tools not found & exit /b 1)
          call "%VSDIR%\VC\Auxiliary\Build\vcvars32.bat" >nul || exit /b 1
          cd native\ts3native
          mkdir out-ea169
          cl /nologo /LD /O2 /MT /W4 /WX /DTS3A_TABLE /Foout-ea169\ /Feout-ea169\ts3native-ea169.asi ts3native.cpp /link /DLL /MAP:out-ea169\ts3native-ea169.map kernel32.lib || exit /b 1
      - name: EA ini (allowlist) and unresolved-row assert
        shell: bash
        env:
          # sections left on for EA (docs/228 §6 first smoke); everything else: every integer-valued key =0
          # (Enabled and independent switches such as [ArenaGuard] TailPad/InitobjFix)
          # [EaDiag] is EA-only (eadiag.cpp, docs/234): kept so its ProductGate=0 default line stays editable for a diagnostic run
          # [WaterJps] is not allowed: its hash guard SKIPs on 1.69 (docs/232 §7), so it would only log a skip
          ALLOW: Decompress OptsInit EaDiag
          # like ALLOW, but Enabled=1 is forced (the Steam ini ships it 0 until verified in game). [FootprintIndex]: standalone,
          # footprint.cpp has no unresolved row, its byte-check site is ok; an FNV mismatch on 1.69 only logs SKIP
          ALLOW_ON: FootprintIndex
        # tools/ini-sections.json (section -> .cpp files naming it as L"<Section>") was built with:
        #   node -e 'const fs=require("fs"),p=require("path"),d="native/ts3native";const secs=[...fs.readFileSync(d+"/ts3native.ini","utf8").matchAll(/^\[(\w+)\]/gm)].map(m=>m[1]);const cpp=fs.readdirSync(d).filter(f=>f.endsWith(".cpp")&&!/test/.test(f)).sort();console.log(JSON.stringify(Object.fromEntries(secs.map(s=>[s,cpp.filter(f=>fs.readFileSync(p.join(d,f),"utf8").includes("L\""+s+"\""))]))))'
        run: |
          node -e '
          const fs = require("fs"), on = process.env.ALLOW_ON.split(" "), allow = process.env.ALLOW.split(" ").concat(on);
          const map = JSON.parse(fs.readFileSync("tools/ini-sections.json", "utf8"));
          const hdr = fs.readFileSync("native/ts3native/ts3addr-ea169.h", "utf8");
          const zero = new Set([...hdr.matchAll(/^\/\/ unresolved: .*native\/ts3native\/([^:\s]+)/gm)].map((m) => m[1]));
          for (const s of allow) {
            if (!map[s]) throw new Error("[" + s + "] is not in tools/ini-sections.json");
            const hit = map[s].filter((f) => zero.has(f));
            if (hit.length) throw new Error("[" + s + "] reads " + hit.join(", ") + ", which has unresolved (0) rows in ts3addr-ea169.h: it cannot be on for EA");
          }
          // outside the allowlist every integer-valued key becomes 0 (TailPad/InitobjFix run independent of Enabled); paths and names stay
          const lines = fs.readFileSync("native/ts3native/ts3native.ini", "utf8").split(/\r?\n/), zeroed = {};
          let sec = "";
          const out = lines.map((l) => {
            const m = /^\[(\w+)\]/.exec(l);
            if (m) { sec = m[1]; return l; }
            if (on.includes(sec) && /^Enabled=/.test(l)) { console.log("forced on [" + sec + "]"); return "Enabled=1"; }
            const k = /^(\w+)=-?\d+\s*$/.exec(l);
            if (!k || allow.includes(sec)) return l;
            if (!/=0\s*$/.test(l)) (zeroed[sec] = zeroed[sec] || []).push(l.trim());
            return k[1] + "=0";
          });
          fs.writeFileSync("native/ts3native/out-ea169/ts3native-ea169.ini", out.join("\r\n"));
          for (const s in zeroed) console.log("zeroed [" + s + "]: " + zeroed[s].join(" "));
          console.log("EA ini: on = " + allow.map((s) => "[" + s + "]").join(" ") + "; " + zero.size + " source files have unresolved rows");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ts3native-ea169
          path: |
            native/ts3native/out-ea169/ts3native-ea169.asi
            native/ts3native/out-ea169/ts3native-ea169.ini
            native/ts3native/ts3addr-ea169.h

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      # compile check of every script under tools/ and mods/ + every self-check that needs no local data (CONTRIBUTING.md)
      - name: Compile and self-check every script
        run: node tools/selftest-all.ts --ci

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, node]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ts3native
          path: ts3native
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release notes = the CHANGELOG.md section headed "## <tag>"
          awk -v tag="$TAG" '$1=="##" {on = ($2==tag)} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section '## $TAG'"; exit 1; }
          # releases ship only the stable patches ([GC], [WaterJps], [Decompress], [SaveWrite], [LotRemoveGuard], [OptsInit], and since
          # v0.1.4 background routing [RouteAsync] + [RouteGate] + [Discourage]; v0.1.5 candidates [SlotEnabledRO], [AvoidRO],
          # [UnseenThrottle], switched by tools/release-features.ts after their A/Bs; v0.2.0 [UnseenFallback] hitch guard): any other enabled section fails the release
          extra=$(awk -F= '{sub(/\r$/, "")} /^\[/ {s=$0} $1=="Enabled" && $2+0 && s!="[GC]" && s!="[WaterJps]" && s!="[Decompress]" && s!="[SaveWrite]" && s!="[LotRemoveGuard]" && s!="[OptsInit]" && s!="[RouteAsync]" && s!="[UnseenFallback]" && s!="[UserDiag]" && s!="[RouteGate]" && s!="[Discourage]" && s!="[SlotEnabledRO]" && s!="[AvoidRO]" && s!="[UnseenThrottle]" {print s}' ts3native/ts3native.ini)
          test -z "$extra" || { echo "Not stable, must be Enabled=0 in ts3native.ini: $extra"; exit 1; }
          # every release lists everything switched on plus install steps (docs/PLAYERS.md): it must name each enabled
          # ts3native section and each ts3fixes tunable shipped True (kInstantiator is the loader, not a feature)
          on=$(awk -F= '{sub(/\r$/, "")} /^\[/ {s=$0} $1=="Enabled" && $2+0 {print s}' ts3native/ts3native.ini;
               grep -oE '<k[A-Za-z]+ value="True"' tools/setup/build-fixes.ts | grep -oE 'k[A-Za-z]+' | grep -v '^kInstantiator$')
          missing=$(for f in $on; do grep -qF "$f" docs/PLAYERS.md || echo "$f"; done)
          test -z "$missing" || { echo "docs/PLAYERS.md does not list: $missing"; exit 1; }
          { echo; echo '---'; echo; cat docs/PLAYERS.md; } >> notes.md
          (cd ts3native && zip -q "../ts3native-$TAG.zip" ts3native.asi ts3native.ini)
          gh release create "$TAG" "ts3native-$TAG.zip" --draft --title "$TAG" --notes-file notes.md
