# Claude Code on GitHub: mention @claude in a PR or issue comment (or a PR review) to get a review or a change as a PR.
# Paid from the repo secret ANTHROPIC_API_KEY, so only the listed accounts can start it (outsiders and other collaborators
# never get a runner). GitHub withholds secrets from fork-PR runs, so it does not run there; never switch this to
# pull_request_target with a checkout of the PR head (that would run untrusted code with the key).
# Runners have no game files (no TS3W.exe, EA DLLs, Ghidra project or saves): game tests, exe RE and the monohost corpus stay local.
# Changes it makes land as PRs on the public repo and are imported into the private master like contributor PRs.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: >-
      contains(fromJSON('["rodneypantonial","alexvixell35-stack"]'), github.actor) &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 25
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(node tools/*),Bash(git diff*),Bash(git log*),Bash(git status*)"
